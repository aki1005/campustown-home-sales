# Publishes this repository's files to GitHub Pages each time you push to main.
# Nothing is built: the site goes live exactly as the files are in the repository.
# Using a framework that needs a build step, such as React? Ask your agent to add the build
# steps before "Package the files" and to change its path to the build output folder, such as dist.
# Before it can publish, turn on GitHub Pages: Settings, then Pages, then set Source to "GitHub Actions".

name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button to the Actions tab, to publish without pushing a change
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Publish one push at a time, and let a publish that has started finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait for the Pages artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..12}; do
            count="$(
              curl --fail --silent --show-error \
                --oauth2-bearer "$GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages&per_page=100" |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(sum(a["name"] == "github-pages" for a in data["artifacts"]))'
            )"
            if [ "${count}" -gt 0 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "The github-pages artifact did not become available in time."
          exit 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
